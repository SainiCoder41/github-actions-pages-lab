<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub CI/CD Practical</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="container">
        <span class="badge" id="ciBadge">CI/CD &amp; GitHub Pages Active</span>
        <h1 id="heading">Welcome to My Website</h1>
        <p id="message">
            Automated continuous integration and deployment with GitHub Actions.
        </p>

        <div class="button-group">
            <button id="changeButton">Click Me</button>
            <button id="resetButton">Reset</button>
        </div>

        <p id="counter">Click Count: 0</p>
        <p id="status">Status: Waiting</p>
    </div>
</body>
</html>
